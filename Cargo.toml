[package]
name = "minigramps"
version = "0.1.0"
edition = "2024"
description = "A small, visual family-tree desktop application"

[dependencies]
eframe = "0.33"
egui_extras = { version = "0.33", features = ["svg"] }
flate2 = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
kamadak-exif = "0.5"
log = "0.4"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
arboard = "3"
directories = "6"
env_logger = "0.11"
raw-window-handle = "0.6"
resvg = "0.45"
rfd = "0.17"
ureq = "2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
