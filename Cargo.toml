[package]
name = "minigramps"
version = "0.1.0"
edition = "2024"
description = "A small, visual family-tree desktop application"

[dependencies]
eframe = "0.33"
egui_extras = { version = "0.33", features = ["svg"] }
resvg = "0.45"
flate2 = "1"
directories = "6"
rfd = "0.17"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
ureq = "2"
raw-window-handle = "0.6"
